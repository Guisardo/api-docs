/transactions:
  get:
    summary: |
      List all the user's transactions.
    description: List all the user's transactions.
    operationId: listTransaction
    tags:
      - transactions
    parameters:
      _tpl_correlationParameter,3:
      _tpl_limitParameter,3:
      _tpl_pageParameter,3:
      - in: query
        name: start
        description: |
          A date formatted YYYY-MM-DD. This is the start date of the selected range (inclusive).
        required: false
        schema:
          type: string
          format: date
          example: "%start_date%"
      - in: query
        name: end
        description: |
          A date formatted YYYY-MM-DD. This is the end date of the selected range (inclusive).
        required: false
        schema:
          type: string
          format: date
          example: "%end_date%"
      - in: query
        name: type
        description: Optional filter on the transaction type(s) returned.
        required: false
        schema:
          $ref: '#/components/schemas/TransactionTypeFilter'
      - in: query
        name: created_since
        description: |
          Only return transactions that were created at or after this moment (inclusive).
          An ISO-8601 date (2026-06-15, from the start of that day) or a date and time (2026-06-15T10:00:00+02:00 or 2026-06-15T08:00:00Z).
          A time without an offset is read in the timezone of the Firefly III installation.
          The value is compared with the "created_at" of the transaction. Clients must URL-encode the plus sign of an offset.
        required: false
        schema:
          type: string
          example: "2026-06-15T10:00:00+02:00"
      - in: query
        name: created_until
        description: |
          Only return transactions that were created at or before this moment (inclusive).
          The same formats as "created_since"; a date without a time means the end of that day. Must not be before "created_since".
        required: false
        schema:
          type: string
          example: "2026-06-30"
      - in: query
        name: updated_since
        description: |
          Only return transactions that were changed at or after this moment (inclusive). The same formats as "created_since".
          The value is compared with the "updated_at" of the transaction. It moves when a transaction is created, edited,
          changed by a rule or moved to another account, and when one split of a transaction that has other splits is deleted.
          It does not move when an account, category or budget that the transaction uses is renamed, or when transactions are marked as reconciled in the web interface.
          Transactions that were deleted altogether are not listed, see /v1/data/deleted.
        required: false
        schema:
          type: string
          example: "2026-06-15T10:00:00+02:00"
      - in: query
        name: updated_until
        description: |
          Only return transactions that were changed at or before this moment (inclusive).
          The same formats as "created_since"; a date without a time means the end of that day. Must not be before "updated_since".
        required: false
        schema:
          type: string
          example: "2026-06-30"
      - in: query
        name: sort
        description: |
          The order of the list: a comma separated list of the fields id, created_at and updated_at. Put a minus sign in front of a field to sort descending, for example -updated_at.
          The order always ends in the ID of the transaction (in the direction of the last field) and the splits of a transaction stay together, so the order is stable from page to page.
          Without "sort" the list is ordered by date, newest first.
          To follow what changed, combine "updated_since" with sort=updated_at.
        required: false
        schema:
          type: string
          example: "updated_at"
    responses:
      "200":
        description: A list of transactions.
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TransactionArray'
      _tpl_validationErrorResponse,3:
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
  post:
    summary: Store a new transaction
    description: Creates a new transaction. The data required can be submitted as a JSON body or as a list of parameters.
    operationId: storeTransaction
    parameters:
      _tpl_correlationParameter,3:
    tags:
      - transactions
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionStore'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TransactionStore'
      description: "JSON array or key=value pairs with the necessary transaction information. See the model for the exact specifications."
      required: true
    responses:
      "200":
        description: 'New transaction stored(s), result in response.'
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TransactionSingle'
      _tpl_validationErrorResponse,3:
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
/transactions/{id}:
  get:
    summary: Get a single transaction.
    description: Get a single transaction.
    operationId: getTransaction
    parameters:
      _tpl_correlationParameter,3:
      - in: path
        name: id
        required: true
        schema:
          type: string
          example: "123"
        description: The ID of the transaction.
    tags:
      - transactions
    responses:
      "200":
        description: 'The requested transaction.'
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TransactionSingle'
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
  put:
    operationId: updateTransaction
    tags:
      - transactions
    description: Update an existing transaction.
    summary: Update existing transaction. For more information, see https://docs.firefly-iii.org/references/firefly-iii/api/specials/
    parameters:
      _tpl_correlationParameter,3:
      - in: path
        name: id
        required: true
        schema:
          type: string
          example: "123"
        description: The ID of the transaction.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionUpdate'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TransactionUpdate'
      description: JSON array with updated transaction information. See the model for the exact specifications.
      required: true
    responses:
      "200":
        description: 'Updated transaction stored, result in response'
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TransactionSingle'
      _tpl_validationErrorResponse,3:
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
  delete:
    operationId: deleteTransaction
    description: Delete a transaction.
    summary: Delete a transaction.
    tags:
      - transactions
    parameters:
      _tpl_correlationParameter,3:
      - in: path
        name: id
        required: true
        schema:
          type: string
          example: "123"
        description: The ID of the transaction.
    responses:
      "204":
        description: Transaction deleted.
      _tpl_unauthenticatedResponse,3:
      _tpl_notFoundResponse,3:
      _tpl_badRequestResponse,3:
      _tpl_internalExceptionResponse,3:
